<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saara &amp; Sahir — Find your table</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <section id="event-splash" class="event-splash">
      <div class="event-splash__inner">
        <p class="eyebrow">Saara &amp; Sahir</p>
        <h1 class="event-splash__title">Which celebration are you joining?</h1>
        <p class="event-splash__subtitle">
          Choose your event to find your seat.
        </p>
        <div class="event-choices">
          <button
            type="button"
            class="event-choice event-choice--pithi"
            data-event="pithi"
          >
            <span class="event-choice__name">Pithi</span>
            <span class="event-choice__event">Haldi celebration</span>
          </button>
          <button
            type="button"
            class="event-choice event-choice--reception"
            data-event="reception"
          >
            <span class="event-choice__name">Reception</span>
            <span class="event-choice__event">Evening celebration</span>
          </button>
        </div>
      </div>
    </section>

    <main class="card" id="lookup" hidden>
      <header>
        <p class="eyebrow">Saara &amp; Sahir</p>
        <h1>Find your table</h1>
        <p class="subtitle">
          Type your name below and we&rsquo;ll point you to your seat.
        </p>
      </header>

      <form id="lookup-form" autocomplete="off" novalidate>
        <label for="name-input" class="visually-hidden">Your name</label>
        <input
          id="name-input"
          name="name"
          type="text"
          placeholder="e.g. Jane Doe"
          spellcheck="false"
          autocapitalize="words"
          required
        />
        <button type="submit">Find my table</button>
      </form>

      <section id="result" class="result" aria-live="polite"></section>

      <footer>
        <p>
          Trouble finding your name?
          <a href="./seating.html">View the full seating plan</a>.
        </p>
      </footer>
    </main>

    <script src="./theme.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
